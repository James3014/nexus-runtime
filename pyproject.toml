[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-runtime"
version = "0.1.0.dev0"
description = "Task planning and execution coordination runtime"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

name: Runtime tests

on:
  pull_request:
    branches:
      - codex/repo-split
  push:
    branches:
      - codex/repo-split

permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out canonical Learning owner
        uses: actions/checkout@v4
        with:
          repository: James3014/nexus-learning
          ref: d09f05b942f35236562ae26e7b718d111368b0b1
          path: .ci/nexus-learning
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned test dependencies and canonical Learning
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest==9.0.2" \
            "pytest-asyncio==1.3.0" \
            "anyio==4.12.1" \
            "pydantic==2.13.5" \
            "PyYAML==6.0.3"
          python -m pip install .ci/nexus-learning

      - name: Install runtime wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir .ci/wheel .
          python -m pip install --no-deps --force-reinstall .ci/wheel/nexus_runtime-*.whl

      - name: Record runtime identity
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          actual_head=$(git rev-parse HEAD)
          actual_tree=$(git rev-parse HEAD^{tree})
          test "$actual_head" = "$expected_head"
          python - <<'PY'
          import pathlib
          import sys

          import nexus_runtime

          print(f"runtime_head={pathlib.Path('.git/HEAD').read_text().strip()}")
          print(f"runtime_module={nexus_runtime.__file__}")
          print(f"python={sys.version}")
          PY
          echo "runtime_head=$actual_head"
          echo "runtime_tree=$actual_tree"

      - name: Provision frozen donor locator
        run: |
          set -euo pipefail
          donor_sha=471a281badda342ccab26606e0c46cbca6867cbb
          donor_repo="$RUNNER_TEMP/nexus-new-donor.git"
          donor_stage="$RUNNER_TEMP/nexus-new-donor-export"
          donor_locator=/private/tmp/astra-production-integrated-20260909
          test ! -e "$donor_repo"
          test ! -e "$donor_stage"
          test ! -e "$donor_locator"
          git init --bare "$donor_repo"
          git -C "$donor_repo" fetch --no-tags --depth=1 \
            https://github.com/James3014/Nexus-new.git "$donor_sha"
          test "$(git --git-dir="$donor_repo" rev-parse "$donor_sha^{commit}")" = "$donor_sha"
          donor_tree=$(git --git-dir="$donor_repo" rev-parse "$donor_sha^{tree}")
          mkdir -p "$donor_stage"
          git --git-dir="$donor_repo" archive "$donor_sha" | tar -x -C "$donor_stage"
          sudo mkdir -p "$donor_locator"
          sudo cp -a "$donor_stage/." "$donor_locator/"
          sudo git -C "$donor_locator" init -q
          sudo mkdir -p "$donor_locator/.git/objects/info"
          echo "$donor_repo/objects" | sudo tee "$donor_locator/.git/objects/info/alternates" >/dev/null
          sudo git -C "$donor_locator" update-ref refs/heads/frozen-donor "$donor_sha"
          sudo git -C "$donor_locator" symbolic-ref HEAD refs/heads/frozen-donor
          sudo git -C "$donor_locator" read-tree "$donor_sha"
          test "$(sudo git -C "$donor_locator" rev-parse HEAD)" = "$donor_sha"
          test "$(sudo git -C "$donor_locator" rev-parse HEAD^{tree})" = "$donor_tree"

      - name: Run full installed-package suite
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-test-results"
          cd "$RUNNER_TEMP"
          python -m pytest -q \
            "$GITHUB_WORKSPACE/tests" \
            --junitxml="$RUNNER_TEMP/runtime-test-results/junit.xml"

      - name: Upload JUnit results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-full-suite-junit-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-test-results/junit.xml
          if-no-files-found: warn

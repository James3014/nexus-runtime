name: Runtime tests

on:
  pull_request:
    branches:
      - codex/repo-split
  push:
    branches:
      - codex/repo-split

permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out runtime
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out frozen context donor
        uses: actions/checkout@v4
        with:
          repository: James3014/Nexus-new
          ref: 471a281badda342ccab26606e0c46cbca6867cbb
          path: .ci/context-donor
          fetch-depth: 1
          persist-credentials: false

      - name: Check out canonical Learning owner
        uses: actions/checkout@v4
        with:
          repository: James3014/nexus-learning
          ref: d09f05b942f35236562ae26e7b718d111368b0b1
          path: .ci/nexus-learning
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned test dependencies and canonical Learning
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest==9.0.2" \
            "pytest-asyncio==1.3.0" \
            "anyio==4.12.1" \
            "pydantic==2.13.5" \
            "PyYAML==6.0.3"
          python -m pip install .ci/nexus-learning

      - name: Install runtime wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir .ci/wheel .
          python -m pip install --no-deps --force-reinstall .ci/wheel/nexus_runtime-*.whl

      - name: Provision frozen donor locator
        run: |
          sudo mkdir -p /private/tmp/astra-production-integrated-20260909
          sudo cp -a .ci/context-donor/. /private/tmp/astra-production-integrated-20260909/
          test "$(git -C /private/tmp/astra-production-integrated-20260909 rev-parse HEAD)" = "471a281badda342ccab26606e0c46cbca6867cbb"

      - name: Run full installed-package suite
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-test-results"
          cd "$RUNNER_TEMP"
          python -m pytest -q \
            "$GITHUB_WORKSPACE/tests" \
            --junitxml="$RUNNER_TEMP/runtime-test-results/junit.xml"

      - name: Upload JUnit results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-full-suite-junit-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-test-results/junit.xml
          if-no-files-found: warn

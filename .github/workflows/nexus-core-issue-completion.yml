name: Nexus Core issue completion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  nexus-core-issue-completion:
    name: Nexus Core issue completion
    runs-on: ubuntu-latest
    steps:
      - name: Delayed spoof canary
        run: |
          sleep 30
          echo "DELAYED_TAMPER_CANARY_SHOULD_NOT_BE_TRUSTED"

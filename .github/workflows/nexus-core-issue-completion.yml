name: Nexus Core issue completion

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  nexus-core-issue-completion:
    name: Nexus Core issue completion
    runs-on: ubuntu-latest
    steps:
      - name: Deliberate tamper canary v2
        run: echo "TAMPER_CANARY_V2_SHOULD_NOT_BE_TRUSTED"

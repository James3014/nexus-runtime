name: Standalone installed wheel

on:
  pull_request:
    branches: [main, codex/repo-split]
  push:
    branches: [main, codex/repo-split]

permissions:
  contents: read

concurrency:
  group: standalone-wheel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-wheel:
    name: Python 3.11 POSIX installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out runtime only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/standalone-wheel-ci.txt

      - name: Create fresh virtual environment
        run: python -m venv "$RUNNER_TEMP/runtime-wheel-venv"

      - name: Install pinned build, test, and Learning dependencies
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/runtime-wheel-venv/bin/python"
          "$venv" -m pip install --requirement requirements/standalone-wheel-ci.txt
          "$venv" -m pip install --no-build-isolation \
            "nexus-learning @ git+https://github.com/James3014/nexus-learning.git@d09f05b942f35236562ae26e7b718d111368b0b1"

      - name: Build wheel and stage tests outside checkout
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/runtime-wheel-venv/bin/python"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          "$venv" -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/runtime-wheel-dist" .
          mkdir -p "$RUNNER_TEMP/runtime-wheel-tests"
          cp tests/test_*.py "$RUNNER_TEMP/runtime-wheel-tests/"

      - name: Install wheel and run isolated acceptance
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/runtime-wheel-venv/bin/python"
          wheel=$(find "$RUNNER_TEMP/runtime-wheel-dist" -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          "$venv" -m pip install --no-deps --force-reinstall "$wheel"
          cd "$RUNNER_TEMP"
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          actual_head=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          test "$actual_head" = "$expected_head"
          env -u PYTHONPATH PYTHONNOUSERSITE=1 "$venv" "$GITHUB_WORKSPACE/scripts/ci/run_standalone_wheel.py" \
            --wheel "$wheel" \
            --tests "$RUNNER_TEMP/runtime-wheel-tests" \
            --junit "$RUNNER_TEMP/runtime-wheel-results/junit.xml" \
            --source-head "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --source-tree "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^{tree})"

      - name: Static check standalone helper
        run: |
          "$RUNNER_TEMP/runtime-wheel-venv/bin/ruff" check scripts/ci/run_standalone_wheel.py

      - name: Upload standalone JUnit results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-standalone-wheel-junit-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-wheel-results/junit.xml
          if-no-files-found: warn

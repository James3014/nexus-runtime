version = 2
base_ref = "origin/main"
allowed_patterns = ["**"]
deletion_policy = "ALLOW"
universe_generation = 2

[isolation]
mode = "container"
image = "ghcr.io/astral-sh/uv:python3.11-bookworm@sha256:58683a39536f1f4ed2e1dd79cf155edccfb47731aba8964bd0312aac942126cf"
network = "bridge"

[[materials]]
id = "learning-revision"
observe_command = [
  "uv", "run", "--no-project",
  "--with", "nexus-learning @ git+https://github.com/James3014/nexus-learning.git@33acad4332b382fac1196c8ea8a8d0f5b543661e",
  "python", "scripts/ci/nexus_core_observe_learning_revision.py",
]
timeout_seconds = 300
logical_subject_id = "dependency/nexus-learning"
evidence_kind = "resolved-dependency"
requirement_mode = "REQUIRED"
applicability = "APPLICABLE"
expected_identity = "git-commit:33acad4332b382fac1196c8ea8a8d0f5b543661e"

[[verifiers]]
id = "retry-budget-fail-closed"
command = [
  "uv", "run", "--no-project",
  "--with", "pytest==9.0.2",
  "--with", "pytest-asyncio==1.3.0",
  "--with", "anyio==4.12.1",
  "--with", "pydantic==2.13.5",
  "--with", "PyYAML==6.0.3",
  "--with", "nexus-learning @ git+https://github.com/James3014/nexus-learning.git@33acad4332b382fac1196c8ea8a8d0f5b543661e",
  "bash", "-c",
  "set -euo pipefail; test \"$(python scripts/ci/nexus_core_observe_learning_revision.py)\" = \"git-commit:33acad4332b382fac1196c8ea8a8d0f5b543661e\"; PYTHONPATH=src python -m pytest -q tests/test_task_retry.py::test_attempt_budget_resolution_failure_fails_closed_before_submit",
]
timeout_seconds = 600
logical_subject_id = "retry/budget-resolution-fail-closed"
evidence_kind = "negative-control"
requirement_mode = "REQUIRED"
applicability = "APPLICABLE"
required_material_ids = ["learning-revision"]

[[verifiers]]
id = "full-installed-package-suite"
command = [
  "bash",
  "scripts/ci/nexus_core_full_installed_suite.sh",
  "33acad4332b382fac1196c8ea8a8d0f5b543661e",
]
timeout_seconds = 1800
logical_subject_id = "runtime/full-installed-package-suite"
evidence_kind = "test-result"
requirement_mode = "REQUIRED"
applicability = "APPLICABLE"
required_material_ids = ["learning-revision"]

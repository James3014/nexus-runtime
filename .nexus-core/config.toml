version = 2
base_ref = "origin/main"
allowed_patterns = ["**"]
deletion_policy = "FORBID"
universe_generation = 1

[[materials]]
id = "nexus-learning-revision"
observe_command = ["uv", "run", "--no-project", "--with", "nexus-learning @ git+https://github.com/James3014/nexus-learning.git@33acad4332b382fac1196c8ea8a8d0f5b543661e", "python", "-c", 'import importlib.metadata as m,json; d=m.distribution("nexus-learning"); p=next(x for x in (d.files or []) if x.name=="direct_url.json"); data=json.loads(p.locate().read_text()); print("git-commit:"+data["vcs_info"]["commit_id"])']
timeout_seconds = 300
logical_subject_id = "dependency/nexus-learning"
evidence_kind = "resolved-dependency"
requirement_mode = "REQUIRED"
applicability = "APPLICABLE"
expected_identity = "git-commit:33acad4332b382fac1196c8ea8a8d0f5b543661e"

[[verifiers]]
id = "retry-budget-negative-control"
command = ["uv", "run", "--no-project", "--with", "pytest==9.0.2", "--with", "pytest-asyncio==1.3.0", "--with", "anyio==4.12.1", "--with", "pydantic==2.13.5", "--with", "PyYAML==6.0.3", "--with", "nexus-runtime @ .", "--with", "nexus-learning @ git+https://github.com/James3014/nexus-learning.git@33acad4332b382fac1196c8ea8a8d0f5b543661e", "python", "-m", "pytest", "-q", "tests/test_task_retry.py::test_attempt_budget_resolution_failure_fails_closed_before_submit"]
timeout_seconds = 600
logical_subject_id = "retry/budget-unavailable"
evidence_kind = "test-result"
requirement_mode = "REQUIRED"
applicability = "APPLICABLE"
required_material_ids = ["nexus-learning-revision"]

[[verifiers]]
id = "runtime-full-installed-suite"
command = ["uv", "run", "--no-project", "--with", "pytest==9.0.2", "--with", "pytest-asyncio==1.3.0", "--with", "anyio==4.12.1", "--with", "pydantic==2.13.5", "--with", "PyYAML==6.0.3", "--with", "nexus-runtime @ .", "--with", "nexus-learning @ git+https://github.com/James3014/nexus-learning.git@33acad4332b382fac1196c8ea8a8d0f5b543661e", "python", "-m", "pytest", "-q", "tests", "--ignore=tests/test_context_hub.py", "--ignore=tests/test_local_ast.py", "--ignore=tests/test_memory_adapters.py", "--ignore=tests/integration/test_owner_workflow.py"]
timeout_seconds = 1800
logical_subject_id = "runtime/full-installed-suite"
